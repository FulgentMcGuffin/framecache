[project]
name = "framecache"
version = "0.1.0"
description = "Redis-backed memoization for polars/numpy frames, with rolling historical call caching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.41.2",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "plotnine>=0.15.7",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sf-hamilton>=1.90.0",
    "tqdm>=4.68.3",
    "redis>=8.0.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "fakeredis>=2.36.2",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framecache"]

[project.urls]
Repository = "https://github.com/hraoyama/FrameCache"

[tool.pytest.ini_options]
testpaths = ["tests"]
